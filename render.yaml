databases:
  - name: marathonvis-db
    plan: free
    databaseName: marathonvis
    user: marathonvis
    region: singapore

services:
  - type: web
    name: marathonvis-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marathonvis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: marathonvis-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_URL
        fromService:
          type: web
          name: marathonvis-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: marathonvis-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: INTERNAL_API_HOSTPORT
        fromService:
          type: web
          name: marathonvis-api
          property: hostport

